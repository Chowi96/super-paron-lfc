<div class="card"><h3>📅 Tres bloques</h3><p class="muted">Cada bloque se cierra una hora antes de su primer partido. Puedes modificar tus predicciones hasta el cierre.</p><div class="small">Bloque 1: 6 partidos · Bloque 2: 6 · Bloque 3: 6</div></div>
<div class="card"><h3>🏆 Clasificación</h3><p class="muted">Consulta aciertos 1X2, exactos, goleadores, plenos y el bonus de tu jugador.</p><button class="btn" onclick="renderPage('ranking')">Ver clasificación</button></div>
</div>`;
}
function featured(){
const p=getP(); const val=db.featured[p.id]||"";
return `${nav("featured")}<div class="card hero"><h2>⭐ Elige tu goleador</h2><p class="muted">Elige un jugador de <b>${esc(p.name)}</b>. Si ese jugador marca durante este parón en cualquiera de los partidos contemplados, tu equipo recibe <b>200.000 €</b>.</p><span class="deadline">⏰ Fecha máxima: 24/09/2026 · 19:45</span>
<div style="margin-top:15px" class="control"><label>Jugador elegido</label><select id="featuredPlayer" ${closed(1)?"disabled":""}><option value="">Selecciona tu jugador...</option>${p.players.map(x=>`<option ${val===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
${closed(1)?`<div class="notice warning">La elección está cerrada.</div>`:"<div class=\"actions\"><button class=\"btn primary\" onclick=\"saveFeatured()\">Guardar elección</button></div>"}
${val?`<div class="notice">⭐ Tu elegido: <b>${esc(val)}</b> · Bonus potencial: <b>200.000 €</b></div>`:""}</div>`;
}
function saveFeatured(){const v=document.getElementById("featuredPlayer").value;if(!v)return alert("Elige un jugador.");db.featured[getP().id]=v;save();renderPage("featured")}

function blockPage(block){
const ms=matches.filter(m=>m.block===block); let html=`${nav("b"+block)}<div class="card hero"><div class="section-title"><div><h2>${block===1?"1️⃣":"2️⃣".replace("2️⃣",block===2?"2️⃣":"3️⃣")} Bloque ${block}</h2><p class="muted">1X2 + resultado exacto + goleador. El goleador se ofrece únicamente entre los convocados de las dos selecciones del partido, sin porteros.</p></div><span class="deadline">⏰ Cierre: ${new Date(deadline(block)).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>
<div class="prizes"><span class="prize">1X2: <b>100.000 €</b></span><span class="prize">Resultado exacto: <b>250.000 €</b></span><span class="prize">Goleador: <b>50.000 €</b></span><span class="prize">Pleno del bloque: <b>1.000.000 €</b></span></div></div><div class="grid">`;
for(const m of ms) html+=matchCard(m);
html+=`</div><div class="card"><div class="actions"><button class="btn primary" ${closed(block)?"disabled":""} onclick="saveBlock(${block})">💾 Guardar bloque ${block}</button></div><div id="saveMsg"></div></div>`;
return html;
}
function matchCard(m){
const p=session.admin?null:getP(); const d=p?getPred(p.id,m.id):{outcome:"",hs:"",as:"",scorer:""}; const opts=allScorers(m);
return `<div class="match"><div class="match-head"><span class="date">${m.date} · ${m.time}</span><span class="pill">Bloque ${m.block}</span></div><div class="teams">${teamInfo[m.home]} 🇪🇺<br><span class="muted" style="font-size:12px">vs</span><br>🇪🇺 ${teamInfo[m.away]}</div>
<div class="controls"><div class="control xwide"><label>1X2</label><select id="o_${m.id}" ${closed(m.block)||session.admin?"disabled":""}><option value="">Selecciona...</option><option ${d.outcome==="1"?"selected":""} value="1">1 · ${teamInfo[m.home]}</option><option ${d.outcome==="X"?"selected":""} value="X">X · Empate</option><option ${d.outcome==="2"?"selected":""} value="2">2 · ${teamInfo[m.away]}</option></select></div>
<div class="control"><label>Goles ${teamInfo[m.home]}</label><input id="h_${m.id}" type="number" min="0" max="20" value="${esc(d.hs)}" ${closed(m.block)||session.admin?"disabled":""}></div>
<div class="control"><label>Goles ${teamInfo[m.away]}</label><input id="a_${m.id}" type="number" min="0" max="20" value="${esc(d.as)}" ${closed(m.block)||session.admin?"disabled":""}></div>
<div class="control xwide"><label>Goleador (convocados, sin porteros)</label><select id="s_${m.id}" ${closed(m.block)||session.admin?"disabled":""}><option value="">Selecciona...</option><option value="NONE" ${d.scorer==="NONE"?"selected":""}>🚫 Sin goleador</option>${opts.map(x=>`<option ${d.scorer===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div></div></div>`;
}
function saveBlock(block){
if(closed(block))return alert("El bloque ya está cerrado.");
const p=getP(); for(const m of matches.filter(x=>x.block===block)){db.predictions[predKey(p.id,m.id)]={outcome:document.getElementById("o_"+m.id).value,hs:document.getElementById("h_"+m.id).value,as:document.getElementById("a_"+m.id).value,scorer:document.getElementById("s_"+m.id).value}}save();document.getElementById("saveMsg").innerHTML='<div class="notice">Predicciones guardadas correctamente.</div>';setTimeout(()=>renderPage("b"+block),500)
}

function ranking(){
const selected = window.rankBlock||0;
const buttons=[0,1,2,3].map(b=>`<button class="tab ${selected===b?"active":""}" onclick="window.rankBlock=${b};window.openPred=null;renderPage('ranking')">${b===0?"Todos":"Bloque "+b}</button>`).join("");
let rows=participants.map(p=>scoreParticipant(p.id,selected)).sort((a,b)=>b.money-a.money);
const me=session?.admin?null:getP()?.id;
const detailPid=window.openPred;
const detail = detailPid ? renderPredictionDetail(detailPid, selected) : "";
const showFeatured = selected===0;
return `${nav("ranking")}<div class="card hero"><div class="section-title"><div><h2>🏆 Clasificación</h2><p class="muted">Abonos conseguidos por cada equipo. Filtra por bloque o consulta el total. Las predicciones rivales solo se muestran cuando el bloque correspondiente ya está cerrado.</p></div></div><div class="tabs" style="margin-top:12px">${buttons}</div><div class="tablewrap"><table class="table"><thead><tr><th>Equipo</th><th>💰 Abonos</th><th>1X2</th><th>Exactos</th><th>Goleadores</th><th>Pleno</th>${showFeatured?"<th>⭐ Jugador LFC</th>":""}<th>Predicciones</th></tr></thead><tbody>${rows.map((r,i)=>{
const canView = me===r.id || (selected>0 ? closed(selected) : [1,2,3].some(b=>closed(b)));
const label = me===r.id ? "Ver mis predicciones" : (canView?"Ver predicciones":"🔒 Bloque abierto");
return `<tr><td><b>${i+1}. ${esc(r.name)}</b></td><td class="money">${fmtMoney(r.money)}</td><td>${r.outcome}</td><td>${r.exact}</td><td>${r.scorer}</td><td>${r.blockBonus}</td>${showFeatured?`<td>${r.featuredPlayer?esc(r.featuredPlayer)+" · "+r.playerStatus:"—"}</td>`:""}<td><button class="btn small" ${canView?`onclick="window.openPred='${r.id}';renderPage('ranking')"`:"disabled"}>${label}</button></td></tr>`;
}).join("")}</tbody></table></div></div>${detail}`;
}
function scoreParticipant(pid,blockFilter){
let money=0,outcome=0,exact=0,scorer=0,bonusBlocks=0;
const blocks=blockFilter?[blockFilter]:[1,2,3];
for(const b of blocks){
 const ms=matches.filter(m=>m.block===b);
 const blockFinished=ms.every(m=>db.results[m.id] && db.results[m.id].hs!=="" && db.results[m.id].as!=="");
 let allExact=true;
 for(const m of ms){
  const r=db.results[m.id]; const p=getPred(pid,m.id);
  if(!r || r.hs==="" || r.as===""){allExact=false;continue;}
  const actualOutcome=x1x2(r.hs,r.as);
  if(p.outcome && p.outcome===actualOutcome){outcome++;money+=CONFIG.prizes.outcome;}
  const ex=(p.hs!==""&&p.as!==""&&+p.hs===+r.hs&&+p.as===+r.as);
  if(ex){exact++;money+=CONFIG.prizes.exact;}else allExact=false;
  const sc=p.scorer!=="" && ((p.scorer==="NONE" && (r.scorers||[]).length===0) || (p.scorer!=="NONE" && (r.scorers||[]).includes(p.scorer)));
  if(sc){scorer++;money+=CONFIG.prizes.scorer;}
 }
 if(blockFinished && ms.length && allExact){bonusBlocks++;money+=CONFIG.prizes.block;}
}
let featuredPlayer=db.featured[pid]||"";
let playerStatus="—";
if(featuredPlayer){
 const status=db.featuredStatus[pid];
 const relevantMatches=matches.filter(m=>[m.squadHome,m.squadAway].some(key=>(squads[key]||[]).includes(featuredPlayer)));
 const hasFuture=relevantMatches.some(m=>new Date(m.date.split("/").reverse().join("-")+"T"+m.time+":00+02:00")>new Date());
 if(status===true){if(!blockFilter) money+=CONFIG.playerBonus;playerStatus="✅";}
 else if(status===false){playerStatus="❌";}
 else if(!relevantMatches.length || !hasFuture){playerStatus="❌";}
 else playerStatus="⏳";
}
const blockBonus=blockFilter?blockStatus(blockFilter,pid):[1,2,3].map(b=>`B${b} ${blockStatus(b,pid)}`).join(" · ");
return {id:pid,name:participants.find(x=>x.id===pid).name,money,outcome,exact,scorer,blockBonus,playerStatus,featuredPlayer};
}
function blockStatus(block,pid){
 const ms=matches.filter(m=>m.block===block);
 const finished=ms.every(m=>db.results[m.id]&&db.results[m.id].hs!==""&&db.results[m.id].as!=="");
 if(!finished)return "⏳";
 const allExact=ms.every(m=>{const r=db.results[m.id],p=getPred(pid,m.id);return p.hs!==""&&p.as!==""&&+p.hs===+r.hs&&+p.as===+r.as;});
 return allExact?"✅":"❌";
}
function renderPredictionDetail(pid, selected){
 const p=participants.find(x=>x.id===pid); if(!p)return "";
 const blocks=selected?[selected]:[1,2,3];
 let html=`<div class="card"><div class="section-title"><h3>📋 Predicciones de ${esc(p.name)}</h3><button class="btn" onclick="window.openPred=null;renderPage('ranking')">Cerrar</button></div>`;
 for(const b of blocks){
  const allowed=(pid===(session?.id))||closed(b);
  html+=`<div style="margin-top:16px"><h3>Bloque ${b} ${closed(b)?"🔓":"🔒"}</h3>`;
  if(!allowed){html+=`<div class="notice warning">Las predicciones de este bloque todavía están ocultas hasta que se cierre.</div></div>`;continue;}
  html+=`<div class="tablewrap"><table class="table"><thead><tr><th>Partido</th><th>1X2</th><th>Marcador</th><th>Goleador</th><th>Estado</th></tr></thead><tbody>`;
  for(const m of matches.filter(x=>x.block===b)){
   const pred=getPred(pid,m.id),r=db.results[m.id];
   const actual=r&&r.hs!==""&&r.as!==""?`${r.hs}-${r.as}`:"—";
   const outActual=r?x1x2(r.hs,r.as):"";
   const outOk=r&&pred.outcome&&pred.outcome===outActual;
   const exactOk=r&&pred.hs!==""&&pred.as!==""&&+pred.hs===+r.hs&&+pred.as===+r.as;
   const scorerOk=r&&pred.scorer!==""&&((pred.scorer==="NONE"&&(r.scorers||[]).length===0)||(pred.scorer!=="NONE"&&(r.scorers||[]).includes(pred.scorer)));
   const resultState=r?`<span class="small muted">Real: ${actual}</span>`:'<span class="pending">⏳ Pendiente</span>';
   html+=`<tr><td>${esc(teamInfo[m.home])} - ${esc(teamInfo[m.away])}<br>${resultState}</td><td>${pred.outcome||"—"} ${r?(outOk?"<span class='ok'>✓</span>":"<span class='bad'>✗</span>"):""}</td><td>${pred.hs!==""&&pred.as!==""?esc(pred.hs)+"-"+esc(pred.as):"—"} ${r?(exactOk?"<span class='ok'>✓</span>":"<span class='bad'>✗</span>"):""}</td><td>${pred.scorer==="NONE"?"Sin goleador":esc(pred.scorer||"—")} ${r?(scorerOk?"<span class='ok'>✓</span>":"<span class='bad'>✗</span>"):""}</td><td>${r?"Comprobado":"Pendiente"}</td></tr>`;
  }
  html+=`</tbody></table></div></div>`;
 }
 return html+`</div>`;
}
function admin(){
return `${nav("admin")}<div class="card hero"><h2>⚙️ Administración</h2><p class="muted">Introduce resultados, varios goleadores y gestiona manualmente el bonus del jugador LFC. También puedes editar o borrar predicciones de cualquier participante.</p></div>
<div class="card"><h3>Resultados de partidos</h3><p class="small muted">Puedes seleccionar <b>varios goleadores</b> manteniendo Ctrl/Cmd al hacer clic. Para 0-0 puedes dejar todos sin seleccionar.</p>
${matches.map(m=>{const r=db.results[m.id]||{hs:"",as:"",scorers:[]};return `<div class="card" style="background:#0c1015"><div class="section-title"><b>${m.date} · ${teamInfo[m.home]} - ${teamInfo[m.away]}</b><span class="pill">Bloque ${m.block}</span></div><div class="admin-row" style="margin-top:10px"><div><label class="small muted">Goles ${teamInfo[m.home]}</label><input id="rh_${m.id}" type="number" min="0" value="${r.hs??""}"></div><div><label class="small muted">Goles ${teamInfo[m.away]}</label><input id="ra_${m.id}" type="number" min="0" value="${r.as??""}"></div><div><label class="small muted">Goleadores</label><select id="rs_${m.id}" multiple size="5">${allScorers(m).map(x=>`<option ${r.scorers?.includes(x)?"selected":""}>${esc(x)}</option>`).join("")}</select></div></div><div class="actions"><button class="btn primary" onclick="saveResult('${m.id}')">Guardar resultado</button></div></div>`}).join("")}</div>
<div class="card"><h3>⭐ Bonus jugador elegido</h3><p class="small muted">Selecciona manualmente el estado. El bonus de 200.000 € se suma una sola vez en la clasificación global.</p><div class="tablewrap"><table class="table"><thead><tr><th>Equipo</th><th>Jugador elegido</th><th>Estado</th></tr></thead><tbody>${participants.map(p=>{const f=db.featured[p.id];const st=db.featuredStatus[p.id];return `<tr><td>${esc(p.name)}</td><td>${f?esc(f):"—"}</td><td><select onchange="setFeaturedStatus('${p.id}',this.value)" ${f?"":"disabled"}><option value="" ${st===undefined?"selected":""}>⏳ Pendiente</option><option value="yes" ${st===true?"selected":""}>✅ Sí, ha marcado</option><option value="no" ${st===false?"selected":""}>❌ No ha marcado</option></select></td></tr>`}).join("")}</tbody></table></div></div>
<div class="card"><h3>🛠️ Editar / borrar predicciones</h3><p class="small muted">Puedes corregir una predicción individual después de que un participante se haya equivocado. El cambio queda guardado en el navegador en esta versión de prueba.</p>${participants.map(p=>`<div class="card" style="background:#0c1015"><div class="section-title"><b>${esc(p.name)}</b><span class="pill">${p.password}</span></div>${[1,2,3].map(b=>`<details style="margin-top:10px"><summary><b>Bloque ${b}</b></summary><div style="margin-top:10px">${matches.filter(m=>m.block===b).map(m=>adminPredictionEditor(p,m)).join("")}</div></details>`).join("")}</div>`).join("")}</div>`;
}
function adminPredictionEditor(p,m){
 const d=getPred(p.id,m.id); const opts=allScorers(m);
 return `<div class="match" style="margin-bottom:8px"><div class="small"><b>${esc(teamInfo[m.home])} - ${esc(teamInfo[m.away])}</b> · ${m.date}</div><div class="controls" style="margin-top:8px"><div class="control"><label>1X2</label><select id="ap_o_${p.id}_${m.id}"><option value="">—</option><option value="1" ${d.outcome==="1"?"selected":""}>1</option><option value="X" ${d.outcome==="X"?"selected":""}>X</option><option value="2" ${d.outcome==="2"?"selected":""}>2</option></select></div><div class="control"><label>Goleador</label><select id="ap_s_${p.id}_${m.id}"><option value="">—</option><option value="NONE" ${d.scorer==="NONE"?"selected":""}>Sin goleador</option>${opts.map(x=>`<option ${d.scorer===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div><div class="control"><label>Goles local</label><input id="ap_h_${p.id}_${m.id}" type="number" min="0" value="${esc(d.hs)}"></div><div class="control"><label>Goles visitante</label><input id="ap_a_${p.id}_${m.id}" type="number" min="0" value="${esc(d.as)}"></div></div><div class="actions"><button class="btn primary" onclick="adminSavePrediction('${p.id}','${m.id}')">Guardar cambios</button><button class="btn red" onclick="adminDeletePrediction('${p.id}','${m.id}')">Borrar predicción</button></div></div>`;
}
function saveResult(id){
 const hs=document.getElementById("rh_"+id).value,as=document.getElementById("ra_"+id).value;
 const sc=[...document.getElementById("rs_"+id).selectedOptions].map(o=>o.value);
 db.results[id]={...(db.results[id]||{}),hs,as,scorers:sc};save();renderPage("admin");
}
function setFeaturedStatus(pid,value){
 if(!db.featuredStatus)db.featuredStatus={};
 db.featuredStatus[pid]=value==="yes"?true:value==="no"?false:undefined;
 if(value==="")delete db.featuredStatus[pid];
 save();renderPage("admin");
}
function adminSavePrediction(pid,mid){
 const key=predKey(pid,mid);
 db.predictions[key]={outcome:document.getElementById(`ap_o_${pid}_${mid}`).value,hs:document.getElementById(`ap_h_${pid}_${mid}`).value,as:document.getElementById(`ap_a_${pid}_${mid}`).value,scorer:document.getElementById(`ap_s_${pid}_${mid}`).value};
 save();renderPage("admin");
}
function adminDeletePrediction(pid,mid){
 if(!confirm("¿Borrar esta predicción?"))return;
 delete db.predictions[predKey(pid,mid)];save();renderPage("admin");
}

function renderPage(page){
const app=document.getElementById("app"); if(page==="home")app.innerHTML=home(); else if(page==="featured")app.innerHTML=featured(); else if(page==="b1")app.innerHTML=blockPage(1); else if(page==="b2")app.innerHTML=blockPage(2); else if(page==="b3")app.innerHTML=blockPage(3); else if(page==="ranking")app.innerHTML=ranking(); else if(page==="admin")app.innerHTML=admin();
}
function render(){if(!session){document.getElementById("app").innerHTML=loginView();return}renderPage("home")}
render();
</script>

<script>
(function () {
  "use strict";

  const TEAM_LOGINS = {
    "Jowy FC": "jowy-fc@superparon-lfc.local",
    "F.C. BERNAL": "fc-bernal@superparon-lfc.local",
    "Tititeam": "tititeam@superparon-lfc.local",
    "Waki Lab": "waki-lab@superparon-lfc.local",
    "Jarama FC": "jarama-fc@superparon-lfc.local",
    "Aranegame FC": "aranegame-fc@superparon-lfc.local",
    "CASTRO S.A.D.": "castro-sad@superparon-lfc.local",
    "Real Byron Caninn": "real-byron-caninn@superparon-lfc.local"
  };

  const TEAM_CODES = {
    "Jowy FC": "JOWY27",
    "F.C. BERNAL": "BERNAL14",
    "Tititeam": "TITI23",
    "Waki Lab": "WAKI31",
    "Jarama FC": "JARA42",
    "Aranegame FC": "ARAN18",
    "CASTRO S.A.D.": "CASTRO55",
    "Real Byron Caninn": "BYRON66"
  };

  async function getSessionData() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return { session: null, profile: null, participant: null };

    const { data: profile, error: profileError } = await supabaseClient
      .from("profiles")
      .select("id,is_admin,participant_id")
      .eq("id", session.user.id)
      .maybeSingle();

    if (profileError) throw profileError;

    let participant = null;
    if (profile && profile.participant_id) {
      const { data, error } = await supabaseClient
        .from("participants")
        .select("*")
        .eq("id", profile.participant_id)
        .maybeSingle();
      if (error) throw error;
      participant = data;
    }

    return { session, profile, participant };
  }

  async function loadPhase1Data() {
    const [
      participants,
      blocks,
      matches,
      fantasyPlayers,
      convocations
    ] = await Promise.all([
      supabaseClient.from("participants").select("*").order("display_order"),
      supabaseClient.from("blocks").select("*").order("starts_at"),
      supabaseClient.from("matches").select("*").order("block_id").order("match_order"),
      supabaseClient.from("fantasy_players").select("*").order("participant_id").order("player_name"),
      supabaseClient.from("convocation_players").select("*").order("match_id").order("player_name")
    ]);

    for (const result of [participants, blocks, matches, fantasyPlayers, convocations]) {
      if (result.error) throw result.error;
    }

    return {
      participants: participants.data || [],
      blocks: blocks.data || [],
      matches: matches.data || [],
      fantasyPlayers: fantasyPlayers.data || [],
      convocations: convocations.data || []
    };
  }

  window.LFC_SUPABASE = {
    client: supabaseClient,
    TEAM_LOGINS,
    TEAM_CODES,
    getSessionData,
    loadPhase1Data
  };

  // Simple console diagnostics. No passwords are logged.
  supabaseClient.auth.getSession().then(async ({ data }) => {
    try {
      const session = data.session;
      if (!session) {
        console.info("[LFC] Supabase conectado. No hay sesión iniciada.");
        return;
      }
      const info = await getSessionData();
      console.info("[LFC] Sesión activa:", {
        email: session.user.email,
        is_admin: info.profile?.is_admin ?? false,
        team: info.participant?.team_name ?? null
      });
    } catch (error) {
      console.error("[LFC] Error comprobando la sesión:", error);
    }
  });

  // Helper intended for the next UI integration step.
  window.lfcLogin = async function (teamName, code) {
    const email = TEAM_LOGINS[teamName];
    if (!email) throw new Error("Equipo no válido.");
    if (!code) throw new Error("Introduce el código.");

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password: code
    });

    if (error) throw error;
    return getSessionData();
  };

  window.lfcLogout = async function () {
    const { error } = await supabaseClient.auth.signOut();
    if (error) throw error;
  };

  window.lfcTestBackend = async function () {
    const info = await getSessionData();
    const data = await loadPhase1Data();
    return {
      authenticated: !!info.session,
      team: info.participant?.team_name || null,
      isAdmin: !!info.profile?.is_admin,
      counts: {
        participants: data.participants.length,
        blocks: data.blocks.length,
        matches: data.matches.length,
        fantasyPlayers: data.fantasyPlayers.length,
        convocations: data.convocations.length
      }
    };
  };
})();
</script>
