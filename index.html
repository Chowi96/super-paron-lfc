<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Parón LFC</title><style>
:root{--bg:#07090c;--panel:#101419;--panel2:#151a20;--text:#f4f6f8;--muted:#9ba5af;--blue:#00a7e1;--red:#ff2028;--green:#2bd576;--yellow:#ffc857;--border:#252c34}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#06243a 0,#07090c 32%),linear-gradient(135deg,#07090c,#0b0e13);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:18px;padding:12px 0 20px}.logo{width:74px;height:74px;object-fit:contain}.brand h1{margin:0;font-size:32px;letter-spacing:.5px}.brand p{margin:5px 0 0;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--border);background:var(--panel);color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{border-color:var(--blue);box-shadow:0 0 0 1px #00a7e155 inset;background:#0b1d29}.card{background:rgba(16,20,25,.95);border:1px solid var(--border);border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 10px 35px #0005}.hero{border-left:4px solid var(--red);border-right:4px solid var(--blue)}h2{margin:0 0 7px}h3{margin:0 0 8px}.muted{color:var(--muted)}.deadline{display:inline-block;padding:6px 10px;border-radius:999px;background:#231316;border:1px solid #5d2329;color:#ffadb1;font-size:13px;font-weight:700}.prizes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.prize{padding:8px 11px;background:#0b1116;border:1px solid var(--border);border-radius:9px;font-size:13px}.prize b{color:var(--yellow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.match{border:1px solid var(--border);background:var(--panel2);border-radius:13px;padding:14px}.match-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.date{font-size:12px;color:var(--muted)}.teams{text-align:center;font-size:18px;font-weight:800;margin:10px 0 13px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.control input,.control select,.login input,.login select,.admin input,.admin select,.admin textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #343c46;background:#080b0f;color:#fff;outline:none}.control input:focus,.control select:focus,.login input:focus{border-color:var(--blue)}.xwide{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{padding:10px 14px;border-radius:9px;border:1px solid var(--border);background:#171d24;color:#fff;cursor:pointer;font-weight:800}.btn.primary{background:linear-gradient(90deg,#006e9e,#00a7e1);border:0}.btn.red{background:linear-gradient(90deg,#a10e15,#ff2028);border:0}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{padding:10px 12px;border-radius:10px;background:#101a13;border:1px solid #24452f;color:#aef2c8;margin-top:10px}.warning{background:#241e0d;border-color:#574817;color:#ffe39a}.login{max-width:520px;margin:30px auto}.login h2{text-align:center}.error{color:#ff8c91;margin-top:8px}.hidden{display:none!important}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--border);text-align:center}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.table td:first-child,.table th:first-child{text-align:left}.money{font-weight:900;color:#ffd35a}.ok{color:var(--green);font-weight:900}.bad{color:#ff6e74;font-weight:900}.pending{color:var(--yellow);font-weight:900}.status{font-size:12px;margin-top:7px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{padding:5px 9px;border-radius:999px;background:#101820;border:1px solid var(--border);font-size:12px}.footer{color:#69737d;font-size:11px;text-align:center;padding:30px 0}.admin-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}.small{font-size:12px}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:auto}.logoBig{width:115px;height:115px;object-fit:contain;display:block;margin:0 auto 10px}
@media(max-width:650px){.wrap{padding:12px}.brand h1{font-size:25px}.controls{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr}.table{min-width:650px}}

.login-grid{max-width:560px;margin:30px auto}.notice{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#0c1015;color:var(--muted);font-size:13px}.match-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.match{padding:14px;border:1px solid var(--border);border-radius:12px;background:#0c1015}.match .teams{font-weight:800;margin:7px 0}.mini{font-size:12px;color:var(--muted)}.hide{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><header class="top"><img class="logo" src="LFC Biwenger(1).png" alt="LFC" onerror="this.style.display='none'"><div class="brand"><h1>SUPER PARÓN LFC</h1><p>La Liga Fantasy de Cuñaos · Especial selecciones 2026</p></div></header><div id="app"></div><div class="footer">Super Parón LFC · Conectado a Supabase · Los resultados oficiales los introduce el administrador.</div></div><script>const SUPABASE_URL = "https://kprkwwfweuqfghgemkml.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rmQwmKN3a2T50VD7fpBqhg_5Fd8pNvV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const TEAM_LOGINS = {
  "Jowy FC":"jowy-fc@superparon-lfc.local","F.C. BERNAL":"fc-bernal@superparon-lfc.local","Tititeam":"tititeam@superparon-lfc.local","Waki Lab":"waki-lab@superparon-lfc.local","Jarama FC":"jarama-fc@superparon-lfc.local","Aranegame FC":"aranegame-fc@superparon-lfc.local","CASTRO S.A.D.":"castro-sad@superparon-lfc.local","Real Byron Caninn":"real-byron-caninn@superparon-lfc.local"
};
let state={session:null,profile:null,participant:null,blocks:[],matches:[],fantasy:[],error:""};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function fmtDate(v){return new Date(v).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function isClosed(b){return Date.now()>=new Date(b.closes_at).getTime()}
async function loadUser(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){state={...state,session:null,profile:null,participant:null};render();return;}
 const {data:profile,error:pe}=await sb.from('profiles').select('*').eq('id',user.id).single(); if(pe)throw pe;
 let participant=null;
 if(profile?.participant_id){const r=await sb.from('participants').select('*').eq('id',profile.participant_id).single();if(r.error)throw r.error;participant=r.data;}
 const [bl,ma,fp]=await Promise.all([
  sb.from('blocks').select('*').order('starts_at'),
  sb.from('matches').select('*').order('block_id').order('match_order'),
  profile?.participant_id ? sb.from('fantasy_players').select('*').eq('participant_id',profile.participant_id).order('player_name') : Promise.resolve({data:[],error:null})
 ]);
 for(const r of [bl,ma,fp])if(r.error)throw r.error;
 state={session:user,profile,participant,blocks:bl.data||[],matches:ma.data||[],fantasy:fp.data||[],error:''};render();
}
async function loginParticipant(){const team=document.getElementById('team').value,password=document.getElementById('password').value,err=document.getElementById('loginError');err.textContent='';const email=TEAM_LOGINS[team];if(!team||!password){err.textContent='Selecciona tu equipo e introduce tu código.';return}const {error}=await sb.auth.signInWithPassword({email,password});if(error){err.textContent='Equipo o código incorrecto.';return}try{await loadUser()}catch(e){await sb.auth.signOut();err.textContent=e.message||'No se han podido cargar tus datos.'}}
async function loginAdmin(){const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value,err=document.getElementById('adminError');err.textContent='';if(!email||!password){err.textContent='Introduce email y contraseña.';return}const {error}=await sb.auth.signInWithPassword({email,password});if(error){err.textContent='Credenciales incorrectas.';return}try{await loadUser();if(!state.profile?.is_admin){await sb.auth.signOut();err.textContent='Este usuario no tiene permisos de administrador.'}}catch(e){await sb.auth.signOut();err.textContent=e.message||'Error al cargar el perfil.'}}
async function logout(){await sb.auth.signOut();state={session:null,profile:null,participant:null,blocks:[],matches:[],fantasy:[],error:''};render()}
function loginView(){const teams=Object.keys(TEAM_LOGINS);return `<div class="login-grid"><div class="card hero"><div class="section-title"><div><h2>🔐 Acceso al Super Parón</h2><p class="muted">Entra con el equipo que tienes asignado.</p></div><span class="pill">FASE 2</span></div><div class="control"><label>Equipo Biwenger</label><select id="team"><option value="">Selecciona...</option>${teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div><div class="control" style="margin-top:10px"><label>Código privado</label><input id="password" type="password" placeholder="Tu código"></div><div id="loginError" class="error"></div><div class="actions"><button class="btn primary" onclick="loginParticipant()">Entrar</button><button class="btn" onclick="document.getElementById('adminBox').classList.toggle('hide')">Acceso administrador</button></div><div class="notice" style="margin-top:14px">El código no está escrito en la web. La validación la realiza Supabase Auth.</div></div><div id="adminBox" class="card hide" style="margin-top:12px"><h3>🛠️ Administrador</h3><div class="control"><label>Email</label><input id="adminEmail" type="email" placeholder="Tu email"></div><div class="control" style="margin-top:10px"><label>Contraseña</label><input id="adminPassword" type="password"></div><div id="adminError" class="error"></div><div class="actions"><button class="btn primary" onclick="loginAdmin()">Entrar como administrador</button></div></div></div>`}
function nav(active){return `<div class="tabs"><button class="tab ${active==='home'?'active':''}" onclick="renderPage('home')">🏠 Inicio</button><button class="tab ${active==='featured'?'active':''}" onclick="renderPage('featured')">⚽ Mi goleador</button><button class="tab ${active==='b1'?'active':''}" onclick="renderPage('b1')">1️⃣ Bloque 1</button><button class="tab ${active==='b2'?'active':''}" onclick="renderPage('b2')">2️⃣ Bloque 2</button><button class="tab ${active==='b3'?'active':''}" onclick="renderPage('b3')">3️⃣ Bloque 3</button><button class="tab ${active==='ranking'?'active':''}" onclick="renderPage('ranking')">🏆 Clasificación</button><button class="tab" onclick="logout()">Salir</button></div>`}
function home(){const p=state.participant;return nav('home')+`<div class="card hero"><div class="section-title"><div><h2>🏆 SUPER PARÓN LFC</h2><p class="muted">Bienvenido, ${esc(p?.team_name||'Administrador')}.</p></div><span class="pill">${state.profile?.is_admin?'ADMINISTRADOR':esc(p?.team_name||'')}</span></div><div class="grid cols-3" style="margin-top:14px"><div class="card"><div class="small muted">Estado de conexión</div><div style="color:var(--green);font-weight:800">● Supabase conectado</div></div><div class="card"><div class="small muted">Tu plantilla</div><div style="font-size:24px;font-weight:900">${state.fantasy.length}</div><div class="small muted">jugadores cargados</div></div><div class="card"><div class="small muted">Partidos</div><div style="font-size:24px;font-weight:900">${state.matches.length}</div><div class="small muted">en 3 bloques</div></div></div><h3 style="margin-top:22px">📅 Calendario</h3><div class="match-grid">${state.blocks.map(x=>`<div class="match"><div class="section-title"><b>${esc(x.name)}</b><span class="pill">${isClosed(x)?'CERRADO':'ABIERTO'}</span></div><div class="small muted">Cierre: ${fmtDate(x.closes_at)}</div><div style="margin-top:8px;font-weight:800">${state.matches.filter(m=>m.block_id===x.id).length} partidos</div></div>`).join('')}</div></div>`}
function featured(){return nav('featured')+`<div class="card hero"><div class="section-title"><div><h2>⚽ Elige tu goleador</h2><p class="muted">Tu plantilla ya está cargada desde Supabase.</p></div><span class="deadline">Cierre: 24/09 · 19:45</span></div><div class="notice">En la siguiente fase añadiremos la selección, filtrando únicamente jugadores convocados y excluyendo porteros.</div><div class="match-grid" style="margin-top:14px">${state.fantasy.map(x=>`<div class="match"><b>${esc(x.player_name)}</b></div>`).join('')}</div></div>`}
function blockPage(n){const b=state.blocks.find(x=>x.id===n),ms=state.matches.filter(x=>x.block_id===n);return nav('b'+n)+`<div class="card hero"><div class="section-title"><div><h2>${n===1?'1️⃣':n===2?'2️⃣':'3️⃣'} Bloque ${n}</h2><p class="muted">Predicciones de 1X2, resultado exacto y goleador.</p></div><span class="deadline">${b?'Cierre: '+fmtDate(b.closes_at):''}</span></div><div class="match-grid">${ms.map(m=>`<div class="match"><div class="mini">${fmtDate(m.starts_at)}</div><div class="teams">${esc(m.home_team)} — ${esc(m.away_team)}</div><div class="small muted">Formulario de predicción: siguiente fase.</div></div>`).join('')}</div></div>`}
function ranking(){return nav('ranking')+`<div class="card hero"><h2>🏆 Clasificación</h2><p class="muted">La clasificación se conectará cuando estén guardadas las predicciones y resultados.</p><div class="notice">La autenticación, los perfiles, tu plantilla y el calendario ya funcionan con Supabase.</div></div>`}
function renderPage(page){const app=document.getElementById('app');if(page==='home')app.innerHTML=home();else if(page==='featured')app.innerHTML=featured();else if(page==='ranking')app.innerHTML=ranking();else app.innerHTML=blockPage(Number(page.slice(1)))}
function render(){const app=document.getElementById('app');if(!state.session){app.innerHTML=loginView();return}renderPage('home')}
window.lfcTestBackend=async()=>{const {data:{user}}=await sb.auth.getUser();return {authenticated:!!user,team:state.participant?.team_name||null,isAdmin:!!state.profile?.is_admin,counts:{blocks:state.blocks.length,matches:state.matches.length,fantasy:state.fantasy.length}}};
(async()=>{try{await loadUser()}catch(e){console.error(e);state.error=e.message||String(e);render()}})();
</script></body></html>
