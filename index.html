*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#06243a 0,#07090c 32%),linear-gradient(135deg,#07090c,#0b0e13);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}a{color:inherit}.wrap{max-width:1220px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:18px;padding:10px 0 18px}.logo{width:74px;height:74px;object-fit:contain}.brand h1{margin:0;font-size:32px;letter-spacing:.5px}.brand p{margin:5px 0 0;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--border);background:var(--panel);color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:800}.tab.active{border-color:var(--blue);box-shadow:0 0 0 1px #00a7e155 inset;background:#0b1d29}.card{background:rgba(16,20,25,.95);border:1px solid var(--border);border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 10px 35px #0005}.hero{border-left:4px solid var(--red);border-right:4px solid var(--blue)}h2{margin:0 0 7px}h3{margin:0 0 8px}.muted{color:var(--muted)}.deadline{display:inline-block;padding:6px 10px;border-radius:999px;background:#231316;border:1px solid #5d2329;color:#ffadb1;font-size:13px;font-weight:800}.prizes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.prize{padding:8px 11px;background:#0b1116;border:1px solid var(--border);border-radius:9px;font-size:13px}.prize b{color:var(--yellow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.match-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}.match{border:1px solid var(--border);background:var(--panel2);border-radius:13px;padding:14px}.match-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.date{font-size:12px;color:var(--muted)}.teams{text-align:center;font-size:18px;font-weight:800;margin:10px 0 13px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.control input,.control select,.login input,.login select,.admin input,.admin select,.admin textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #343c46;background:#080b0f;color:#fff;outline:none}.control input:focus,.control select:focus,.login input:focus{border-color:var(--blue)}.xwide{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{padding:10px 14px;border-radius:9px;border:1px solid var(--border);background:#171d24;color:#fff;cursor:pointer;font-weight:800}.btn.primary{background:linear-gradient(90deg,#006e9e,#00a7e1);border:0}.btn.red{background:linear-gradient(90deg,#a10e15,#ff2028);border:0}.btn.green{background:linear-gradient(90deg,#167a43,#2bd576);border:0;color:#07110b}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{padding:11px 13px;border-radius:10px;background:#101a13;border:1px solid #24452f;color:#aef2c8;margin-top:10px}.warning{background:#241e0d;border-color:#574817;color:#ffe39a}.error{color:#ff8c91;margin-top:8px}.success{color:#9ff0ba;margin-top:8px}.hidden{display:none!important}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.table td:first-child,.table th:first-child{text-align:left}.money{font-weight:900;color:#ffd35a}.ok{color:var(--green);font-weight:900}.bad{color:#ff6e74;font-weight:900}.pending{color:var(--yellow);font-weight:900}.status{font-size:12px;margin-top:7px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{padding:5px 9px;border-radius:999px;background:#101820;border:1px solid var(--border);font-size:12px}.footer{color:#69737d;font-size:11px;text-align:center;padding:30px 0}.small{font-size:12px}.mini{font-size:12px;color:var(--muted)}.login-grid{max-width:570px;margin:28px auto}.logoBig{width:105px;height:105px;object-fit:contain;display:block;margin:0 auto 12px}.team-tag{font-size:12px;color:#9edfff}.pred-detail{font-size:12px;color:#cfd6dd;line-height:1.5;text-align:left}.subtle{opacity:.85}.rank-num{font-weight:900;color:#aab5bf}.statbox{padding:14px;border:1px solid var(--border);border-radius:12px;background:#0c1015}.statbox .v{font-size:25px;font-weight:900}.filtertabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.filtertabs button{padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:#10151b;color:#fff;cursor:pointer}.filtertabs button.active{border-color:var(--blue);background:#0b2533}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modalbox{width:min(920px,100%);max-height:90vh;overflow:auto;background:#0d1217;border:1px solid var(--border);border-radius:15px;padding:18px}.scorer-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:7px;max-height:310px;overflow:auto;padding:5px}.check{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:#10161c}.check input{width:auto}.admin-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}.select-small{padding:8px;border-radius:8px;background:#080b0f;color:#fff;border:1px solid #343c46}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#111820;border:1px solid #34414d;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:0 10px 30px #0008}.toast.ok{border-color:#287c4b}.toast.err{border-color:#9c343a}
@media(max-width:650px){.wrap{padding:12px}.brand h1{font-size:25px}.controls,.admin-row{grid-template-columns:1fr}.table{min-width:860px}}

<body><div class="wrap">
<header class="top"><img class="logo" src="LFC Biwenger(1).png" alt="LFC" onerror="this.style.display='none'"><div class="brand"><h1>SUPER PARÓN LFC</h1><p>La Liga Fantasy de Cuñaos · Especial selecciones 2026</p></div></header>
<div id="app"></div><div id="modalRoot"></div><div class="footer">Super Parón LFC · Resultados oficiales introducidos por el administrador.</div>

<script>
const SUPABASE_URL="https://kprkwwfweuqfghgemkml.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_rmQwmKN3a2T50VD7fpBqhg_5Fd8pNvV";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const TEAM_LOGINS={"Jowy FC":"jowy-fc@superparon-lfc.local","F.C. BERNAL":"fc-bernal@superparon-lfc.local","Tititeam":"tititeam@superparon-lfc.local","Waki Lab":"waki-lab@superparon-lfc.local","Jarama FC":"jarama-fc@superparon-lfc.local","Aranegame FC":"aranegame-fc@superparon-lfc.local","CASTRO S.A.D.":"castro-sad@superparon-lfc.local","Real Byron Caninn":"real-byron-caninn@superparon-lfc.local"};
let state={user:null,profile:null,profiles:[],participant:null,participants:[],blocks:[],matches:[],fantasy:[],convos:[],predictions:[],picks:[],results:[],scorers:[],page:"home",rankFilter:"all",loading:false};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const money=n=>new Intl.NumberFormat("es-ES").format(n)+" €";
const fmtDate=v=>new Date(v).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtDateLong=v=>new Date(v).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const closed=b=>b?Date.now()>=new Date(b.closes_at).getTime():false;
const blockById=id=>state.blocks.find(b=>Number(b.id)===Number(id));
const matchById=id=>state.matches.find(m=>Number(m.id)===Number(id));
const resultByMatch=id=>state.results.find(r=>Number(r.match_id)===Number(id));
const scorersByMatch=id=>state.scorers.filter(s=>Number(s.match_id)===Number(id));
const pred=(pid,mid)=>state.predictions.find(p=>Number(p.participant_id)===Number(pid)&&Number(p.match_id)===Number(mid));
const pickFor=pid=>state.picks.find(p=>Number(p.participant_id)===Number(pid));
function toast(msg,ok=true){const d=document.createElement("div");d.className="toast "+(ok?"ok":"err");d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function x1x2(h,a){if(h===null||a===null||h===undefined||a===undefined||h===""||a==="")return "";return Number(h)>Number(a)?"1":Number(h)<Number(a)?"2":"X"}
function outcomeLabel(v){return v==="1"?"1 · Local":v==="X"?"X · Empate":v==="2"?"2 · Visitante":"—"}
function isAdmin(){return !!state.profile?.is_admin}
function currentPid(){return state.participant?.id}
function currentTeamName(){return state.participant?.team_name||"Administrador"}
function nav(active){let admin=isAdmin()?`<button class="tab ${active==='admin'?'active':''}" onclick="go('admin')">⚙️ Admin</button>`:"";return `<div class="tabs"><button class="tab ${active==='home'?'active':''}" onclick="go('home')">🏠 Inicio</button><button class="tab ${active==='featured'?'active':''}" onclick="go('featured')">⭐ Mi goleador</button><button class="tab ${active==='b1'?'active':''}" onclick="go('b1')">1️⃣ Bloque 1</button><button class="tab ${active==='b2'?'active':''}" onclick="go('b2')">2️⃣ Bloque 2</button><button class="tab ${active==='b3'?'active':''}" onclick="go('b3')">3️⃣ Bloque 3</button><button class="tab ${active==='ranking'?'active':''}" onclick="go('ranking')">🏆 Clasificación</button>${admin}<button class="tab" onclick="logout()">Salir</button></div>`}
async function loadData(){
 state.loading=true;render();
 const {data:{user},error:ue}=await sb.auth.getUser(); if(ue)throw ue;
 if(!user){state={...state,user:null,profile:null,profiles:[],participant:null,participants:[],blocks:[],matches:[],fantasy:[],convos:[],predictions:[],picks:[],results:[],scorers:[],loading:false};render();return;}
 const pr=await sb.from("profiles").select("*").eq("id",user.id).single();if(pr.error)throw pr.error;
 let part=null;if(pr.data.participant_id){const q=await sb.from("participants").select("*").eq("id",pr.data.participant_id).single();if(q.error)throw q.error;part=q.data;}
 const [pa,prf,bl,ma,fp,cv,re,sc,pd,pk]=await Promise.all([
  sb.from("participants").select("*").order("display_order"),
  pr.data.is_admin ? sb.from("profiles").select("id,participant_id,is_admin") : Promise.resolve({data:[pr.data],error:null}),
  sb.from("blocks").select("*").order("starts_at"),
  sb.from("matches").select("*").order("block_id").order("match_order"),
  sb.from("fantasy_players").select("*").order("participant_id").order("player_name"),
  sb.from("convocation_players").select("*").order("match_id").order("player_name"),
  sb.from("match_results").select("*"),
  sb.from("match_scorers").select("*"),
  sb.from("predictions").select("*"),
  sb.from("player_picks").select("*")
 ]);
 for(const r of [pa,prf,bl,ma,fp,cv,re,sc,pd,pk])if(r.error)throw r.error;
 state={...state,user,profile:pr.data,participant:part,participants:pa.data||[],profiles:prf.data||[],blocks:bl.data||[],matches:ma.data||[],fantasy:fp.data||[],convos:cv.data||[],results:re.data||[],scorers:sc.data||[],predictions:pd.data||[],picks:pk.data||[],loading:false};render();
}
async function loginParticipant(){const team=document.getElementById("team").value,password=document.getElementById("password").value,err=document.getElementById("loginError");err.textContent="";if(!team||!password){err.textContent="Selecciona tu equipo e introduce tu código.";return}const {error}=await sb.auth.signInWithPassword({email:TEAM_LOGINS[team],password});if(error){err.textContent="Equipo o código incorrecto.";return}try{await loadData()}catch(e){await sb.auth.signOut();err.textContent=e.message||"No se han podido cargar tus datos."}}
async function loginAdmin(){const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value,err=document.getElementById("adminError");err.textContent="";const {error}=await sb.auth.signInWithPassword({email,password});if(error){err.textContent="Credenciales incorrectas.";return}try{await loadData();if(!isAdmin()){await sb.auth.signOut();err.textContent="Este usuario no tiene permisos de administrador."}}catch(e){await sb.auth.signOut();err.textContent=e.message||"Error al cargar el perfil."}}
async function logout(){await sb.auth.signOut();state={user:null,profile:null,profiles:[],participant:null,participants:[],blocks:[],matches:[],fantasy:[],convos:[],predictions:[],picks:[],results:[],scorers:[],page:"home",rankFilter:"all",loading:false};render()}
async function sendPasswordReset(){const email=document.getElementById("resetEmail").value.trim(),msg=document.getElementById("resetMsg");msg.textContent="";if(!email){msg.innerHTML='<span class="error">Introduce tu email.</span>';return}const redirectTo=window.location.origin+window.location.pathname;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error){msg.innerHTML='<span class="error">'+esc(error.message)+'</span>';return}msg.innerHTML='<span class="ok">✓ Hemos enviado un enlace de recuperación a ese correo. Revisa también spam.</span>'}
function recoveryView(){return `<div class="login-grid"><div class="card hero"><img class="logoBig" src="LFC Biwenger(1).png" alt="LFC"><h2 style="text-align:center">🔑 Nueva contraseña</h2><p class="muted" style="text-align:center">Escribe una nueva contraseña para tu cuenta.</p><div class="control"><label>Nueva contraseña</label><input id="newPassword" type="password" minlength="6" placeholder="Mínimo 6 caracteres"></div><div class="control" style="margin-top:10px"><label>Repite la contraseña</label><input id="newPassword2" type="password" minlength="6" placeholder="Repite la contraseña"></div><div id="recoveryMsg"></div><div class="actions"><button class="btn primary" onclick="updatePassword()">Cambiar contraseña</button></div></div></div>`}
async function updatePassword(){const p1=document.getElementById("newPassword").value,p2=document.getElementById("newPassword2").value,msg=document.getElementById("recoveryMsg");msg.textContent="";if(p1.length<6){msg.innerHTML='<span class="error">La contraseña debe tener al menos 6 caracteres.</span>';return}if(p1!==p2){msg.innerHTML='<span class="error">Las contraseñas no coinciden.</span>';return}const {error}=await sb.auth.updateUser({password:p1});if(error){msg.innerHTML='<span class="error">'+esc(error.message)+'</span>';return}msg.innerHTML='<span class="ok">✓ Contraseña actualizada correctamente. Ya puedes entrar con ella.</span>';setTimeout(async()=>{state.recovery=false;await sb.auth.signOut();render()},1200)}
function resetView(){return `<div class="login-grid"><div class="card hero"><img class="logoBig" src="LFC Biwenger(1).png" alt="LFC"><h2 style="text-align:center">🔐 Recuperar contraseña</h2><p class="muted" style="text-align:center">Introduce el email de tu cuenta de administrador.</p><div class="control"><label>Email</label><input id="resetEmail" type="email" placeholder="Tu email" onkeydown="if(event.key==='Enter')sendPasswordReset()"></div><div id="resetMsg"></div><div class="actions"><button class="btn primary" onclick="sendPasswordReset()">Enviar enlace</button><button class="btn" onclick="render()">Volver</button></div></div></div>`}
function renderReset(){state.page="reset";document.getElementById("app").innerHTML=resetView()}
function loginView(){const teams=Object.keys(TEAM_LOGINS);return `<div class="login-grid"><div class="card hero"><img class="logoBig" src="LFC Biwenger(1).png" alt="LFC"><h2 style="text-align:center">🔐 Acceso al Super Parón</h2><p class="muted" style="text-align:center">Entra con el equipo que tienes asignado.</p><div class="control"><label>Equipo Biwenger</label><select id="team"><option value="">Selecciona...</option>${teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select></div><div class="control" style="margin-top:10px"><label>Código privado</label><input id="password" type="password" placeholder="Tu código" onkeydown="if(event.key==='Enter')loginParticipant()"></div><div id="loginError" class="error"></div><div class="actions"><button class="btn primary" onclick="loginParticipant()">Entrar</button><button class="btn" onclick="document.getElementById('adminBox').classList.toggle('hidden')">Acceso administrador</button></div><div class="notice">El código no está escrito en la web. La validación la realiza Supabase Auth.</div></div><div id="adminBox" class="card hidden"><h3>⚙️ Administrador</h3><div class="control"><label>Email</label><input id="adminEmail" type="email" placeholder="Tu email"></div><div class="control" style="margin-top:10px"><label>Contraseña</label><input id="adminPassword" type="password" onkeydown="if(event.key==='Enter')loginAdmin()"></div><div id="adminError" class="error"></div><div class="actions"><button class="btn primary" onclick="loginAdmin()">Entrar como administrador</button><button class="btn" onclick="renderReset()">¿Has olvidado la contraseña?</button></div></div></div>`}
function home(){const p=state.participant;const total=calcTotals(currentPid());return nav("home")+`<div class="card hero"><div class="section-title"><div><h2>🏆 SUPER PARÓN LFC</h2><p class="muted">Predice, acierta y suma abonos para tu equipo durante el parón internacional.</p></div><span class="pill">${isAdmin()?"ADMINISTRADOR":esc(p?.team_name||"")}</span></div><div class="grid" style="margin-top:14px"><div class="statbox"><div class="small muted">Tu acumulado</div><div class="v money">${money(total.total)}</div><div class="small muted">incluye bonus global si está resuelto</div></div><div class="statbox"><div class="small muted">Partidos</div><div class="v">${state.matches.length}</div><div class="small muted">3 bloques · 18 partidos</div></div><div class="statbox"><div class="small muted">Tu plantilla</div><div class="v">${isAdmin()?state.fantasy.length:(state.fantasy.filter(f=>Number(f.participant_id)===Number(currentPid())).length)}</div><div class="small muted">jugadores cargados</div></div></div><div class="grid" style="margin-top:12px"><div class="card"><h3>⭐ Elige tu goleador LFC</h3><p class="muted">Elige cualquier jugador de tu plantilla antes del 24/09 a las 19:45. Si marca durante el parón, son <b>200.000 €</b>.</p><button class="btn primary" onclick="go('featured')">${pickFor(currentPid())?"Ver / cambiar jugador":"Elegir jugador"}</button></div><div class="card"><h3>🏆 Clasificación</h3><p class="muted">Consulta aciertos 1X2, exactos, goleadores, plenos y el bonus global.</p><button class="btn" onclick="go('ranking')">Ver clasificación</button></div></div><h3 style="margin-top:20px">📅 Bloques</h3><div class="match-grid">${state.blocks.map(b=>`<div class="match"><div class="section-title"><b>${esc(b.name)}</b><span class="pill">${closed(b)?"CERRADO":"ABIERTO"}</span></div><div class="small muted">Cierre: ${fmtDateLong(b.closes_at)}</div><div style="margin-top:8px;font-weight:800">${state.matches.filter(m=>Number(m.block_id)===Number(b.id)).length} partidos</div><button class="btn" style="margin-top:10px" onclick="go('b${b.id}')">${closed(b)?"Ver bloque":"Hacer predicciones"}</button></div>`).join("")}</div></div>`}
function featured(){const pid=currentPid();const mine=pickFor(pid);const b=state.blocks.find(x=>Number(x.id)===1);const isClosed=closed(b);const players=state.fantasy.filter(f=>Number(f.participant_id)===Number(pid)).sort((a,b)=>a.player_name.localeCompare(b.player_name,"es"));if(isAdmin())return adminFeatured();return nav("featured")+`<div class="card hero"><div class="section-title"><div><h2>⭐ Elige tu goleador</h2><p class="muted">Puedes elegir <b>cualquier jugador de tu plantilla</b>, aunque no participe en estos partidos de selecciones.</p></div><span class="deadline">⏰ Cierre: ${fmtDateLong(b.closes_at)}</span></div>${isClosed?`<div class="notice">🔒 El plazo está cerrado. Tu elección queda bloqueada.</div>`:`<div class="notice warning">Elige un solo jugador. Si ese jugador marca durante el parón, tu equipo recibe <b>200.000 €</b>.</div>`}<div class="control" style="margin-top:14px"><label>Jugador de ${esc(state.participant.team_name)}</label><select id="featuredPlayer" ${isClosed?"disabled":""}><option value="">Selecciona un jugador...</option>${players.map(f=>`<option value="${f.id}" ${mine?.fantasy_player_id==f.id?"selected":""}>${esc(f.player_name)}</option>`).join("")}</select></div><div id="featuredMsg"></div>${!isClosed?`<div class="actions"><button class="btn primary" onclick="saveFeatured()">Guardar elección</button></div>`:""}${mine?`<div class="card"><b>Tu elección:</b> ${esc(players.find(x=>x.id==mine.fantasy_player_id)?.player_name||"—")}<br><span class="status">Estado: ${pickStatusLabel(mine.status)}</span></div>`:""}</div>`}
function pickStatusLabel(s){return s==="yes"?`<span class="ok">✓ Ha marcado · +200.000 €</span>`:s==="no"?`<span class="bad">✗ No ha marcado</span>`:`<span class="pending">◷ Pendiente de resolver</span>`}
async function saveFeatured(){const v=document.getElementById("featuredPlayer").value,msg=document.getElementById("featuredMsg");msg.textContent="";if(!v){msg.innerHTML='<span class="error">Elige un jugador.</span>';return}const {error}=await sb.from("player_picks").upsert({participant_id:currentPid(),user_id:state.user.id,fantasy_player_id:Number(v),status:"pending",updated_at:new Date().toISOString()},{onConflict:"participant_id"});if(error){msg.innerHTML='<span class="error">'+esc(error.message)+'</span>';return}await loadData();toast("Elección guardada")}
function convosForMatch(mid){return state.convos.filter(c=>Number(c.match_id)===Number(mid)&&!c.is_goalkeeper).sort((a,b)=>a.player_name.localeCompare(b.player_name,"es"))}
function blockPage(n){const b=blockById(n),ms=state.matches.filter(m=>Number(m.block_id)===Number(n));return nav("b"+n)+`<div class="card hero"><div class="section-title"><div><h2>${n===1?"1️⃣":n===2?"2️⃣":"3️⃣"} Bloque ${n}</h2><p class="muted">1X2 + resultado exacto + goleador. El goleador se elige entre los convocados de las dos selecciones del partido, sin porteros.</p></div><span class="deadline">⏰ Cierre: ${b?fmtDateLong(b.closes_at):"—"}</span></div><div class="prizes"><div class="prize">1X2: <b>100.000 €</b></div><div class="prize">Resultado exacto: <b>250.000 €</b></div><div class="prize">Goleador exacto: <b>50.000 €</b></div><div class="prize">6 exactos: <b>1.000.000 €</b></div></div><div class="match-grid" style="margin-top:14px">${ms.map(matchCard).join("")}</div><div id="blockMsg"></div>${!closed(b)?`<div class="actions"><button class="btn primary" onclick="saveBlock(${n})">💾 Guardar bloque ${n}</button></div>`:`<div class="notice">🔒 Este bloque está cerrado. Las predicciones ya no se pueden modificar.</div>`}</div>`}
function matchCard(m){
 const b=blockById(m.block_id),d=pred(currentPid(),m.id)||{},canEdit=!isAdmin()&&!closed(b);
 const conv=convosForMatch(m.id); const selectedSc=d.scorer_player_id||"";
 const opts=conv.map(c=>'<option value="'+c.id+'" '+(String(selectedSc)===String(c.id)?'selected':'')+'>'+esc(c.player_name)+'</option>').join('');
 const noneSelected=(d.scorer_player_id===null||d.scorer_player_id==='NONE')?'selected':'';
 return '<div class="match"><div class="match-head"><span class="date">'+fmtDateLong(m.starts_at)+'</span><span class="pill">'+(closed(b)?'CERRADO':'ABIERTO')+'</span></div><div class="teams">'+esc(m.home_team)+' — '+esc(m.away_team)+'</div><div class="controls">'+
 '<div class="control"><label>1X2</label><select id="o_'+m.id+'" '+(canEdit?'':'disabled')+'><option value="">Selecciona...</option><option value="1" '+(d.prediction_1x2==='1'?'selected':'')+'>1 · Gana '+esc(m.home_team)+'</option><option value="X" '+(d.prediction_1x2==='X'?'selected':'')+'>X · Empate</option><option value="2" '+(d.prediction_1x2==='2'?'selected':'')+'>2 · Gana '+esc(m.away_team)+'</option></select></div>'+
 '<div class="control"><label>Resultado exacto</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="h_'+m.id+'" type="number" min="0" max="20" placeholder="Local" value="'+(d.predicted_home_goals??'')+'" '+(canEdit?'':'disabled')+'><input id="a_'+m.id+'" type="number" min="0" max="20" placeholder="Visit." value="'+(d.predicted_away_goals??'')+'" '+(canEdit?'':'disabled')+'></div></div>'+
 '<div class="control xwide"><label>Goleador</label><select id="s_'+m.id+'" '+(canEdit?'':'disabled')+'><option value="">Selecciona...</option><option value="NONE" '+noneSelected+'>🚫 Sin goleador</option>'+opts+'</select></div></div>'+
 (d.id?'<div class="status">Tu predicción guardada · '+outcomeLabel(d.prediction_1x2)+' · '+d.predicted_home_goals+'-'+d.predicted_away_goals+'</div>':'<div class="status muted">Sin predicción guardada todavía.</div>')+'</div>';
}
function validatePrediction(mid){const o=document.getElementById("o_"+mid).value,h=document.getElementById("h_"+mid).value,a=document.getElementById("a_"+mid).value,s=document.getElementById("s_"+mid).value;if(!o||h===""||a===""||!s)return {error:"Completa 1X2, resultado exacto y goleador en todos los campos."};const hh=Number(h),aa=Number(a);if(!Number.isInteger(hh)||!Number.isInteger(aa)||hh<0||aa<0)return {error:"Los goles deben ser números enteros iguales o mayores que 0."};if(x1x2(hh,aa)!==o)return {error:"El 1X2 no coincide con el resultado exacto."};if(hh===0&&aa===0&&s!=="NONE")return {error:"Un 0-0 debe llevar 'Sin goleador'."};if((hh>0||aa>0)&&s==="NONE")return {error:"Si hay goles, selecciona un goleador."};return {data:{prediction_1x2:o,predicted_home_goals:hh,predicted_away_goals:aa,scorer_player_id:s==="NONE"?null:Number(s)}}}
async function saveBlock(n){if(isAdmin()){toast("El administrador no introduce predicciones desde aquí.",false);return}const b=blockById(n);if(closed(b)){toast("El plazo ya está cerrado.",false);return}const ms=state.matches.filter(m=>Number(m.block_id)===Number(n));const rows=[];for(const m of ms){const v=validatePrediction(m.id);if(v.error){document.getElementById("blockMsg").innerHTML='<div class="error">'+esc(v.error)+" · Revisa el partido "+esc(m.home_team)+"–"+esc(m.away_team)+".</div>";return}rows.push({...v.data,participant_id:currentPid(),user_id:state.user.id,match_id:m.id,updated_at:new Date().toISOString()})}const {error}=await sb.from("predictions").upsert(rows,{onConflict:"participant_id,match_id"});if(error){document.getElementById("blockMsg").innerHTML='<div class="error">'+esc(error.message)+"</div>";return}await loadData();toast("Bloque guardado correctamente")}
function calcMatch(pid,m){const p=pred(pid,m.id),r=resultByMatch(m.id);let one=0,exact=0,sc=0;if(!p)return {one,exact,sc,total:0,p:null,r};if(!r)return {one,exact,sc,total:0,p,r};const actual=x1x2(r.home_goals,r.away_goals);if(p.prediction_1x2===actual)one=100000;if(Number(p.predicted_home_goals)===Number(r.home_goals)&&Number(p.predicted_away_goals)===Number(r.away_goals))exact=250000;if(p.scorer_player_id!==null&&p.scorer_player_id!==undefined&&scorersByMatch(m.id).some(s=>Number(s.player_id)===Number(p.scorer_player_id)))sc=50000;return {one,exact,sc,total:one+exact+sc,p,r}}
function calcTotals(pid,filter="all"){if(!pid)return {total:0,one:0,exact:0,sc:0,pleno:0,featured:0,blocks:{}};let blocks={};for(const b of state.blocks){if(filter!=="all"&&Number(filter)!==Number(b.id))continue;const ms=state.matches.filter(m=>Number(m.block_id)===Number(b.id));let one=0,exact=0,sc=0,allExact=true,completed=true;for(const m of ms){const x=calcMatch(pid,m);one+=x.one;exact+=x.exact;sc+=x.sc;if(!x.r)completed=false;if(!x.r||x.exact!==250000)allExact=false}const pleno=completed&&allExact&&ms.length===6?1000000:0;blocks[b.id]={one,exact,sc,pleno,completed,total:one+exact+sc+pleno};}let total=Object.values(blocks).reduce((a,b)=>a+b.total,0);let one=Object.values(blocks).reduce((a,b)=>a+b.one,0),exact=Object.values(blocks).reduce((a,b)=>a+b.exact,0),sc=Object.values(blocks).reduce((a,b)=>a+b.sc,0),pleno=Object.values(blocks).reduce((a,b)=>a+b.pleno,0);let featured=0;if(filter==="all"){const pk=pickFor(pid);featured=pk?.status==="yes"?200000:0;total+=featured}return {total,one,exact,sc,pleno,featured,blocks}}
function featuredState(pid){const pk=pickFor(pid);if(!pk)return {label:"Sin elección",cls:"pending"};return pk.status==="yes"?{label:"✓ +200.000 €",cls:"ok"}:pk.status==="no"?{label:"✗ No ha marcado",cls:"bad"}:{label:"◷ Pendiente",cls:"pending"}}
function predictionVisibility(pid,m){const b=blockById(m.block_id);return isAdmin()||Number(pid)===Number(currentPid())||closed(b)}
function ranking(){let f=state.rankFilter||"all";const rows=state.participants.map(p=>{const c=calcTotals(p.id,f);return {...p,c}}).sort((a,b)=>b.c.total-a.c.total||a.display_order-b.display_order);const showFeatured=f==="all";return nav("ranking")+`<div class="card hero"><div class="section-title"><div><h2>🏆 Clasificación</h2><p class="muted">Los bonus de cada partido se acumulan. El bonus de 200.000 € del jugador LFC solo aparece en <b>Todos</b>.</p></div><span class="pill">${f==="all"?"TODOS":"BLOQUE "+f}</span></div><div class="filtertabs">${[["all","Todos"],[1,"Bloque 1"],[2,"Bloque 2"],[3,"Bloque 3"]].map(([v,l])=>`<button class="${String(f)===String(v)?"active":""}" onclick="setRankFilter('${v}')">${l}</button>`).join("")}</div><div class="tablewrap"><table class="table"><thead><tr><th># · Equipo</th><th>💰 Total</th><th>1X2</th><th>Exactos</th><th>Goleadores</th><th>Pleno</th>${showFeatured?"<th>⭐ Jugador LFC</th>":""}<th>Predicciones</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="rank-num">${i+1}</span> · <b>${esc(r.team_name)}</b></td><td class="money">${money(r.c.total)}</td><td>${r.c.one/100000} ✓</td><td>${r.c.exact/250000} ✓</td><td>${r.c.sc/50000} ✓</td><td>${blockPlenoCell(r.id,f)}</td>${showFeatured?`<td>${featuredCell(r.id)}</td>`:""}<td><button class="btn" onclick="openPredictions(${r.id},'${f}')">Ver</button></td></tr>`).join("")}</tbody></table></div></div>`}
function blockPlenoCell(pid,f){if(f==="all"){return state.blocks.map(b=>{const c=calcTotals(pid,String(b.id)).blocks[b.id];return `<span title="Bloque ${b.id}" class="${c?.pleno?'ok':c?.completed?'bad':'pending'}">${c?.pleno?'✓':'✗'}</span>`}).join(" ")}const b=blockById(Number(f)),c=calcTotals(pid,String(f)).blocks[b?.id];return c?.pleno?'<span class="ok">✓ +1.000.000 €</span>':c?.completed?'<span class="bad">✗</span>':'<span class="pending">◷</span>'}
function featuredCell(pid){const pk=pickFor(pid),fp=state.fantasy.find(f=>Number(f.id)===Number(pk?.fantasy_player_id));if(!pk)return "—";return `<div>${esc(fp?.player_name||"—")}</div><div class="status ${featuredState(pid).cls}">${featuredState(pid).label}</div>`}
function setRankFilter(v){state.rankFilter=v;renderPage("ranking")}
function openPredictions(pid,filter){const team=state.participants.find(p=>Number(p.id)===Number(pid));let ms=state.matches.filter(m=>filter==="all"||Number(m.block_id)===Number(filter));let html=`<div class="modal"><div class="modalbox"><div class="section-title"><div><h2>📋 ${esc(team?.team_name||"Equipo")}</h2><p class="muted">${filter==="all"?"Todos los bloques":"Bloque "+filter}</p></div><button class="btn" onclick="closeModal()">Cerrar</button></div>`;for(const m of ms){const p=pred(pid,m.id),r=resultByMatch(m.id),canSee=predictionVisibility(pid,m),b=blockById(m.block_id),sp=p?.scorer_player_id?state.convos.find(c=>Number(c.id)===Number(p.scorer_player_id))?.player_name:"Sin goleador";if(!canSee){html+=`<div class="match"><b>${esc(m.home_team)} — ${esc(m.away_team)}</b><div class="status pending">🔒 Predicción oculta hasta ${fmtDateLong(b.closes_at)}</div></div>`;continue}let checks="";if(p){const x=calcMatch(pid,m);checks=r?`<span class="${x.one?'ok':'bad'}">1X2 ${x.one?'✓':'✗'}</span> · <span class="${x.exact?'ok':'bad'}">Exacto ${x.exact?'✓':'✗'}</span> · <span class="${x.sc?'ok':'bad'}">Goleador ${x.sc?'✓':'✗'}</span>`:`<span class="pending">Pendiente de resultado</span>`}html+=`<div class="match"><div class="section-title"><b>${esc(m.home_team)} — ${esc(m.away_team)}</b><span class="mini">${fmtDate(m.starts_at)}</span></div><div class="pred-detail"><b>1X2:</b> ${outcomeLabel(p?.prediction_1x2)}<br><b>Resultado:</b> ${p?esc(p.predicted_home_goals)+"-"+esc(p.predicted_away_goals):"—"}<br><b>Goleador:</b> ${esc(sp||"Sin goleador")}<br><b>Resultado real:</b> ${r?esc(r.home_goals)+"-"+esc(r.away_goals):"Pendiente"}</div><div class="status">${checks}</div>${isAdmin()?`<div class="actions"><button class="btn" onclick="closeModal();openAdminPrediction(${pid},${m.id})">✏️ Editar</button><button class="btn red" onclick="adminDeletePrediction(${pid},${m.id})">Borrar</button></div>`:""}</div>`}html+=`</div></div>`;document.getElementById("modalRoot").innerHTML=html}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function admin(){return nav("admin")+`<div class="card hero"><div class="section-title"><div><h2>⚙️ Administración</h2><p class="muted">Introduce resultados, selecciona varios goleadores, resuelve el bonus del jugador LFC y gestiona predicciones.</p></div><span class="pill">SOLO ADMIN</span></div><div class="grid"><div class="card"><h3>📊 Resumen</h3><div class="small muted">Partidos con resultado</div><div style="font-size:28px;font-weight:900">${state.results.length}/${state.matches.length}</div><div class="small muted">Bloques cerrados: ${state.blocks.filter(closed).length}/3</div></div><div class="card"><h3>⭐ Bonus jugador LFC</h3><p class="muted">Marca manualmente si el jugador elegido ha marcado durante el parón.</p><button class="btn primary" onclick="openFeaturedAdmin()">Gestionar bonus</button></div></div><h3 style="margin-top:20px">⚽ Resultados oficiales</h3><div class="match-grid">${state.matches.map(m=>adminResultCard(m)).join("")}</div><h3 style="margin-top:24px">📝 Predicciones de participantes</h3><div class="match-grid">${state.participants.map(p=>`<div class="match"><b>${esc(p.team_name)}</b><div class="small muted" style="margin-top:6px">Gestiona cualquier predicción, incluso antes del cierre.</div><button class="btn" style="margin-top:10px" onclick="openAdminTeam(${p.id})">Abrir predicciones</button></div>`).join("")}</div></div>`}
function adminResultCard(m){const r=resultByMatch(m.id),sc=scorersByMatch(m.id),names=sc.map(x=>state.convos.find(c=>Number(c.id)===Number(x.player_id))?.player_name).filter(Boolean);return `<div class="match"><div class="match-head"><span class="date">${fmtDateLong(m.starts_at)}</span><span class="pill">${r?"RESULTADO CARGADO":"PENDIENTE"}</span></div><div class="teams">${esc(m.home_team)} — ${esc(m.away_team)}</div><div class="controls"><div class="control"><label>Goles local</label><input id="arh_${m.id}" type="number" min="0" max="30" value="${r?.home_goals??""}"></div><div class="control"><label>Goles visitante</label><input id="ara_${m.id}" type="number" min="0" max="30" value="${r?.away_goals??""}"></div></div><div class="small muted" style="margin-top:8px">Goleadores actuales: ${names.length?esc(names.join(", ")):"ninguno"}</div><div class="actions"><button class="btn primary" onclick="openResultModal(${m.id})">${r?"✏️ Editar resultado":"➕ Introducir resultado"}</button>${r?`<button class="btn red" onclick="deleteResult(${m.id})">Borrar resultado</button>`:""}</div></div>`}
function openResultModal(mid){const m=matchById(mid),r=resultByMatch(mid),selected=new Set(scorersByMatch(mid).map(x=>Number(x.player_id))),cv=convosForMatch(mid);document.getElementById("modalRoot").innerHTML=`<div class="modal"><div class="modalbox"><div class="section-title"><div><h2>⚽ ${esc(m.home_team)} — ${esc(m.away_team)}</h2><p class="muted">Selecciona todos los goleadores reales del partido.</p></div><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="controls"><div class="control"><label>Goles local</label><input id="mrh" type="number" min="0" max="30" value="${r?.home_goals??""}"></div><div class="control"><label>Goles visitante</label><input id="mra" type="number" min="0" max="30" value="${r?.away_goals??""}"></div></div><div style="margin-top:15px"><b>Goleadores</b><div class="scorer-list">${cv.map(c=>`<label class="check"><input type="checkbox" value="${c.id}" ${selected.has(Number(c.id))?"checked":""}>${esc(c.player_name)}</label>`).join("")}</div></div><div id="resultModalError" class="error"></div><div class="actions"><button class="btn primary" onclick="saveResult(${mid})">💾 Guardar resultado</button></div></div></div>`}
async function saveResult(mid){const h=Number(document.getElementById("mrh").value),a=Number(document.getElementById("mra").value),err=document.getElementById("resultModalError");if(!Number.isInteger(h)||!Number.isInteger(a)||h<0||a<0){err.textContent="Introduce goles válidos.";return}const checks=[...document.querySelectorAll('#modalRoot input[type="checkbox"]:checked')].map(x=>Number(x.value));if(checks.length>h+a){err.textContent="No puedes seleccionar más goleadores que goles totales.";return}const {error:re}=await sb.from("match_results").upsert({match_id:mid,home_goals:h,away_goals:a,entered_by:state.user.id,entered_at:new Date().toISOString()},{onConflict:"match_id"});if(re){err.textContent=re.message;return}const del=await sb.from("match_scorers").delete().eq("match_id",mid);if(del.error){err.textContent=del.error.message;return}if(checks.length){const ins=await sb.from("match_scorers").insert(checks.map(pid=>({match_id:mid,player_id:pid})));if(ins.error){err.textContent=ins.error.message;return}}closeModal();await loadData();toast("Resultado guardado")}
async function deleteResult(mid){if(!confirm("¿Borrar el resultado y los goleadores de este partido?"))return;let r=await sb.from("match_scorers").delete().eq("match_id",mid);if(r.error){toast(r.error.message,false);return}r=await sb.from("match_results").delete().eq("match_id",mid);if(r.error){toast(r.error.message,false);return}await loadData();toast("Resultado borrado")}
function openFeaturedAdmin(){const rows=state.participants.map(p=>{const pk=pickFor(p.id),fp=state.fantasy.find(f=>Number(f.id)===Number(pk?.fantasy_player_id));return `<div class="match"><div class="section-title"><b>${esc(p.team_name)}</b><span>${esc(fp?.player_name||"Sin elección")}</span></div><div class="control" style="margin-top:9px"><label>Estado</label><select id="fps_${p.id}"><option value="pending" ${pk?.status==="pending"?"selected":""}>◷ Pendiente</option><option value="yes" ${pk?.status==="yes"?"selected":""}>✓ Ha marcado (+200.000 €)</option><option value="no" ${pk?.status==="no"?"selected":""}>✗ No ha marcado</option></select></div><div class="actions"><button class="btn primary" onclick="saveFeaturedStatus(${p.id})">Guardar</button></div></div>`}).join("");document.getElementById("modalRoot").innerHTML=`<div class="modal"><div class="modalbox"><div class="section-title"><div><h2>⭐ Bonus jugador LFC</h2><p class="muted">Resolución manual por participante.</p></div><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="match-grid">${rows}</div></div></div>`}
async function saveFeaturedStatus(pid){const pk=pickFor(pid);if(!pk){toast("Ese participante todavía no ha elegido jugador.",false);return}const status=document.getElementById("fps_"+pid).value;const {error}=await sb.from("player_picks").update({status,marked_at:status==="pending"?null:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("participant_id",pid);if(error){toast(error.message,false);return}await loadData();openFeaturedAdmin();toast("Estado actualizado")}
function openAdminTeam(pid){const p=state.participants.find(x=>Number(x.id)===Number(pid));document.getElementById("modalRoot").innerHTML=`<div class="modal"><div class="modalbox"><div class="section-title"><div><h2>📝 ${esc(p.team_name)}</h2><p class="muted">Editar o borrar cualquier predicción.</p></div><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="match-grid">${state.matches.map(m=>adminPredictionCard(pid,m)).join("")}</div></div></div>`}
function adminPredictionCard(pid,m){const p=pred(pid,m.id),cv=convosForMatch(m.id),sp=p?.scorer_player_id||"";return `<div class="match"><div class="section-title"><b>${esc(m.home_team)} — ${esc(m.away_team)}</b><span class="mini">${fmtDate(m.starts_at)}</span></div><div class="controls" style="margin-top:8px"><div class="control"><label>1X2</label><select id="ap_o_${pid}_${m.id}"><option value="">—</option><option value="1" ${p?.prediction_1x2==="1"?"selected":""}>1</option><option value="X" ${p?.prediction_1x2==="X"?"selected":""}>X</option><option value="2" ${p?.prediction_1x2==="2"?"selected":""}>2</option></select></div><div class="control"><label>Goleador</label><select id="ap_s_${pid}_${m.id}"><option value="">—</option><option value="NONE" ${p&&!p.scorer_player_id?"selected":""}>Sin goleador</option>${cv.map(c=>`<option value="${c.id}" ${String(sp)===String(c.id)?"selected":""}>${esc(c.player_name)}</option>`).join("")}</select></div><div class="control"><label>Goles local</label><input id="ap_h_${pid}_${m.id}" type="number" min="0" value="${p?.predicted_home_goals??""}"></div><div class="control"><label>Goles visitante</label><input id="ap_a_${pid}_${m.id}" type="number" min="0" value="${p?.predicted_away_goals??""}"></div></div><div class="actions"><button class="btn primary" onclick="adminSavePrediction(${pid},${m.id})">Guardar</button>${p?`<button class="btn red" onclick="adminDeletePrediction(${pid},${m.id})">Borrar</button>`:""}</div></div>`}
async function adminSavePrediction(pid,mid){const o=document.getElementById(`ap_o_${pid}_${mid}`).value,h=document.getElementById(`ap_h_${pid}_${mid}`).value,a=document.getElementById(`ap_a_${pid}_${mid}`).value,s=document.getElementById(`ap_s_${pid}_${mid}`).value;if(!o||h===""||a===""||!s){toast("Completa todos los campos.",false);return}const hh=Number(h),aa=Number(a);if(x1x2(hh,aa)!==o){toast("El 1X2 no coincide con el resultado exacto.",false);return}if(hh===0&&aa===0&&s!=="NONE"){toast("Un 0-0 debe llevar Sin goleador.",false);return}if((hh>0||aa>0)&&s==="NONE"){toast("Si hay goles, selecciona un goleador.",false);return}const profileForParticipant=state.profiles.find(p=>Number(p.participant_id)===Number(pid));const {error}=await sb.from("predictions").upsert({participant_id:pid,user_id:profileForParticipant?.id||null,match_id:mid,prediction_1x2:o,predicted_home_goals:hh,predicted_away_goals:aa,scorer_player_id:s==="NONE"?null:Number(s),updated_at:new Date().toISOString()},{onConflict:"participant_id,match_id"});if(error){toast(error.message,false);return}await loadData();openAdminTeam(pid);toast("Predicción guardada")}
async function adminDeletePrediction(pid,mid){if(!confirm("¿Borrar esta predicción?"))return;const {error}=await sb.from("predictions").delete().eq("participant_id",pid).eq("match_id",mid);if(error){toast(error.message,false);return}await loadData();if(document.getElementById("modalRoot").innerHTML)openAdminTeam(pid);toast("Predicción borrada")}
function go(page){state.page=page;renderPage(page)}
function renderPage(page){state.page=page;const app=document.getElementById("app");if(!state.user){app.innerHTML=loginView();return}if(state.loading){app.innerHTML='<div class="card"><div class="notice">Cargando datos…</div></div>';return}if(page==="home")app.innerHTML=home();else if(page==="featured")app.innerHTML=featured();else if(page==="ranking")app.innerHTML=ranking();else if(page==="admin"&&isAdmin())app.innerHTML=admin();else if(/^b[123]$/.test(page))app.innerHTML=blockPage(Number(page.slice(1)));else app.innerHTML=home()}
function render(){renderPage(state.page||"home")}
window.lfcTestBackend=async()=>{const {data:{user}}=await sb.auth.getUser();return {authenticated:!!user,team:state.participant?.team_name||null,isAdmin:!!state.profile?.is_admin,counts:{participants:state.participants.length,blocks:state.blocks.length,matches:state.matches.length,fantasy:state.fantasy.length,convocations:state.convos.length,predictions:state.predictions.length,picks:state.picks.length,results:state.results.length,scorers:state.scorers.length}}};
sb.auth.onAuthStateChange((event)=>setTimeout(()=>{if(event==="PASSWORD_RECOVERY"){state.recovery=true;state.user=null;render();return}loadData().catch(console.error)},0));
loadData().catch(e=>{console.error(e);state.loading=false;document.getElementById("app").innerHTML=`<div class="card hero"><h2>⚠️ No se han podido cargar los datos</h2><p class="error">${esc(e.message||String(e))}</p><button class="btn" onclick="loadData()">Reintentar</button></div>`});
</script></body></html>
